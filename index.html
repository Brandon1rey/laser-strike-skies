<!DOCTYPE html>
<!-- Laser Strike Skies — clon web del juego Roblox (estética Roblox: avatar
     R6 blocky en 3a persona, vista trasera, mundo de bloques plástico).
     Core verb: volar hacia adelante + láser auto-aim. 3 misiones del spec:
     DESTRUIR DRONES → ESCORTAR NAVE → OMEGA MEGA-BOT. Armas del registro:
     Pulse Laser R1 / Mega-Beam. Monedas: Energy Cores + Starlight.
     Todo procedimental (sin assets externos), mobile-first. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Laser Strike Skies — Roblox-style Web Demo</title>
<style>
  html,body{margin:0;height:100%;background:#0e1420;overflow:hidden;font-family:system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:linear-gradient(#1b2a4a,#0e1420);touch-action:none;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;color:#fff;user-select:none;-webkit-user-select:none}
  #hud{position:absolute;top:10px;left:14px;font:700 16px/1.3 system-ui;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px #000}
  #hud .core{color:#ffd166;font-size:20px}
  #hud .cryst{color:#ff6bd6;font-size:13px}
  #hud .xp{color:#7df9ff;font-size:12px;opacity:.9}
  #hud .shields{font-size:13px;letter-spacing:2px}
  #waveBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;font:800 13px system-ui;letter-spacing:.14em;color:#9fe8ff;text-shadow:0 0 14px #0ff8;opacity:0;transition:opacity .3s;white-space:nowrap}
  #bossBarWrap{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:min(320px,54vw);height:9px;background:#241a30;border:1px solid #ff5470aa;border-radius:5px;opacity:0;transition:opacity .3s}
  #bossBar{height:100%;width:100%;background:linear-gradient(90deg,#ff5470,#ff8c42);border-radius:5px;transition:width .15s}
  #escortBarWrap{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:min(320px,54vw);height:9px;background:#241a30;border:1px solid #7df9ffaa;border-radius:5px;opacity:0;transition:opacity .3s}
  #escortBar{height:100%;width:100%;background:linear-gradient(90deg,#7df9ff,#4dd0ff);border-radius:5px;transition:width .15s}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(8,12,22,.72)}
  .screen h1{font:900 min(8vw,44px) system-ui;letter-spacing:.06em;margin:0;color:#fff;text-shadow:0 4px 0 #1a2a5a,0 0 26px #4db8ff66}
  .screen h1 .strike{color:#ff5470;text-shadow:0 4px 0 #5a1020,0 0 26px #f058}
  .screen p{margin:0;opacity:.88;font-size:14px;padding:0 24px;line-height:1.5;color:#cfe4ff}
  .screen .core-note{color:#ffd166}
  .btn{pointer-events:auto;font:800 20px system-ui;padding:14px 46px;border-radius:8px;cursor:pointer;min-width:44px;min-height:44px;border:none;color:#fff;background:linear-gradient(#7edb3a,#4caf28);box-shadow:0 4px 0 #2e7a14,0 0 18px #7edb3a55;letter-spacing:.04em}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2e7a14}
  .btn.ghost{background:linear-gradient(#5a6b8c,#3d4a66);box-shadow:0 4px 0 #232c40}
  #mute{position:absolute;top:10px;right:14px;pointer-events:auto;opacity:.7;font-size:22px;background:none;border:none;color:#fff;cursor:pointer;min-width:44px;min-height:44px}
  .hidden{display:none !important}
  #banner{position:absolute;top:34%;left:0;right:0;text-align:center;font:900 26px system-ui;letter-spacing:.1em;color:#fff;text-shadow:0 3px 0 #1a2a5a,0 0 24px #7df9ff;opacity:0;pointer-events:none;padding:0 10px}
  #banner.show{animation:bannerIn 1.6s ease forwards}
  @keyframes bannerIn{0%{opacity:0;transform:translateY(24px) scale(.94)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  #weaponBtn{position:absolute;bottom:24px;right:18px;pointer-events:auto;min-width:64px;min-height:64px;border-radius:12px;border:2px solid #ff5470;background:rgba(20,12,20,.75);color:#ff9c9c;font:700 11px system-ui;letter-spacing:.04em;box-shadow:0 3px 0 #00000066}
  #winScr h1{color:#7dffa8;text-shadow:0 4px 0 #1a5a2a,0 0 26px #2f8}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="ui">
  <div id="hud"></div>
  <div id="waveBar"></div>
  <div id="escortBarWrap"><div id="escortBar"></div></div>
  <div id="bossBarWrap"><div id="bossBar"></div></div>
  <button id="mute" aria-label="mute">🔊</button>
  <button id="weaponBtn" class="hidden">PULSE<br>R1</button>
  <div id="banner"></div>
  <div id="menuScr" class="screen">
    <h1>LASER <span class="strike">STRIKE</span> SKIES</h1>
    <p>Clon web estilo Roblox — avatar blocky, vuelo en 3a persona.<br>
    <span class="core-note">◆ Energy Cores</span> + <span style="color:#ff6bd6">✧ Starlight</span> · 3 misiones: Drones · Escolta · <b>Omega Mega-Bot</b></p>
    <p style="font-size:12px;opacity:.65">WASD/flechas o joystick táctil · Q / botón para arma</p>
    <button class="btn" id="startBtn">▶ PLAY</button>
  </div>
  <div id="overScr" class="screen hidden">
    <h1 style="color:#ff5470">MISIÓN FALLIDA</h1>
    <p id="finalScore"></p>
    <button class="btn" id="retryBtn">REINTENTAR</button>
  </div>
  <div id="winScr" class="screen hidden">
    <h1 style="color:#7dffa8">MISIÓN COMPLETA</h1>
    <p id="winScore"></p>
    <button class="btn" id="againBtn">OTRA SALIDA</button>
  </div>
</div>
<script>
"use strict";
/* ============================== TUNING ============================== */
const TUNING = {
  playerSpeed: 260, playerAccel: 2200, playerDrag: 5, playerR: 20,
  laserRange: 420, fireCooldown: 0.14, laserSpeed: 620, laserR: 5,
  shields: 3, invulnTime: 1.3,
  droneHP: 1, droneR: 22, droneSpeed: 150, droneBounty: 1,
  interHP: 2, interR: 20, interSpeed: 210, interBounty: 2,
  escortHP: 5, escortR: 30,
  bossHP: 30, bossR: 70, bossBounty: 10,
  bossPhaseIdle: 0.8, bossTelegraph: 0.55, bossVuln: 2.2,
  wave1Count: 8, wave1SpawnEvery: 1.3,
  wave2SpawnEvery: 1.0, wave2Interceptors: 8,
  coreDropChance: 0.45, coreValue: 10, crystalBounty: 5, coreMagnetR: 120,
  shakeHit: 6, shakeHitPlayer: 14, shakeDeath: 20,
  particleCap: 380, bulletCap: 90, enemyCap: 60, coreCap: 40, popupCap: 24,
  masterVolume: 0.3,
  FOV: 460,          // distancia focal de la proyección pseudo-3D
  playerZ: 0,        // z del plano del jugador (0 = cerca)
  spawnZ: -520,      // z donde nacen los enemigos (lejos)
};
/* ============================ CANVAS & DPR =========================== */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const VIEW = { w: 800, h: 480 };
function orientView() {
  const portrait = innerHeight > innerWidth;
  VIEW.w = portrait ? 480 : 800;
  VIEW.h = portrait ? 800 : 480;
  resize();
}
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const scale = Math.min(innerWidth / VIEW.w, innerHeight / VIEW.h);
  cv.style.width = VIEW.w * scale + "px"; cv.style.height = VIEW.h * scale + "px";
  cv.width = Math.round(VIEW.w * scale * dpr); cv.height = Math.round(VIEW.h * scale * dpr);
  ctx.setTransform(cv.width / VIEW.w, 0, 0, cv.height / VIEW.h, 0, 0);
}
addEventListener("resize", orientView); addEventListener("orientationchange", orientView);
/* ============================ SEEDED RNG =========================== */
let rngState = 20260802;
function rng() { rngState = (rngState * 1664525 + 1013904223) >>> 0; return rngState / 4294967296; }
/* =============================== AUDIO ============================== */
let AC = null, masterGain = null, muted = false;
function audioInit() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = AC.createGain(); masterGain.gain.value = TUNING.masterVolume; masterGain.connect(AC.destination);
}
function beep(freq, dur, type = "square", slideTo = null, vol = 1) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + dur + 0.02);
}
const vary = f => f * (0.9 + rng() * 0.2);
function pickupChime() { [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, 0.06, "sine"), i * 55)); }
function fanfare() { [392, 523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.14, "triangle"), i * 90)); }
document.getElementById("mute").onclick = e => { muted = !muted; e.target.textContent = muted ? "🔇" : "🔊"; };
/* =============================== INPUT ============================== */
const input = { axis: {x:0, y:0}, action: false, actionPressed: false, weaponPressed: false };
const keys = {};
const KEYMAP = { KeyW:"up", ArrowUp:"up", KeyS:"down", ArrowDown:"down", KeyA:"left", ArrowLeft:"left", KeyD:"right", ArrowRight:"right", KeyQ:"weapon", Space:"act", Enter:"act" };
addEventListener("keydown", e => {
  const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); audioInit();
  if (k === "weapon" && !keys.weapon) input.weaponPressed = true;
  if (k === "act" && !keys.act) input.actionPressed = true;
  keys[k] = true;
});
addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
const touch = { joyId: null, joyOx: 0, joyOy: 0, joyX: 0, joyY: 0 };
function cvPos(t){ const r = cv.getBoundingClientRect(); return { x: (t.clientX - r.left) / r.width * VIEW.w, y: (t.clientY - r.top) / r.height * VIEW.h }; }
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); audioInit();
  if (touch.joyId === null) { touch.joyId = e.pointerId; const p = cvPos(e); touch.joyOx = p.x; touch.joyOy = p.y; touch.joyX = p.x; touch.joyY = p.y; }
});
cv.addEventListener("pointermove", e => { if (e.pointerId === touch.joyId) { const p = cvPos(e); touch.joyX = p.x; touch.joyY = p.y; } });
function endPointer(e){ if (e.pointerId === touch.joyId) touch.joyId = null; }
cv.addEventListener("pointerup", endPointer); cv.addEventListener("pointercancel", endPointer);
document.getElementById("weaponBtn").addEventListener("click", () => { audioInit(); input.weaponPressed = true; });
function pollInput() {
  let x = (keys.right?1:0) - (keys.left?1:0), y = (keys.down?1:0) - (keys.up?1:0);
  if (touch.joyId !== null) {
    const dx = touch.joyX - touch.joyOx, dy = touch.joyY - touch.joyOy, d = Math.hypot(dx, dy), R = 52;
    if (d > 6) { const k = Math.min(d / R, 1) / d; x = dx * k; y = dy * k; }
  }
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  input.axis.x = x; input.axis.y = y;
}
/* =============================== POOL =============================== */
function pool(factory, cap) {
  const items = [];
  return {
    items, cap,
    spawn(init) {
      let it = items.find(i => !i.alive);
      if (!it) { if (items.length >= cap) { it = items.reduce((a,b)=>a.age>b.age?a:b); } else { it = factory(); items.push(it); } }
      it.alive = true; it.age = 0; init(it); return it;
    },
    each(fn) { for (let i = 0; i < items.length; i++) if (items[i].alive) fn(items[i]); },
    count() { let n = 0; for (const i of items) if (i.alive) n++; return n; },
    clear() { for (const i of items) i.alive = false; },
  };
}
/* ========================= CAMERA & PARTICLES ======================= */
const cam = { x: 0, y: 0, shake: 0 };
const particles = pool(() => ({}), TUNING.particleCap);
function burst(x, y, color, n = 12, speed = 220) {
  for (let i = 0; i < n; i++) {
    const a = rng() * Math.PI * 2, s = speed * (0.3 + rng() * 0.7);
    particles.spawn(p => { p.x=x; p.y=y; p.vx=Math.cos(a)*s; p.vy=Math.sin(a)*s; p.r=2+rng()*3; p.life=p.maxLife=0.35+rng()*0.35; p.color=color; });
  }
}
function updateParticles(dt) {
  particles.each(p => { p.age+=dt; p.life-=dt; if (p.life<=0) { p.alive=false; return; } p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96; });
}
function renderParticles() {
  ctx.globalCompositeOperation = "lighter";
  particles.each(p => { ctx.globalAlpha = p.life/p.maxLife; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,7); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}
/* ============================= COLLISION ============================ */
function hitCircle(a, b, ra, rb) { const dx=a.sx-b.sx, dy=a.sy-b.sy, r=ra+rb; return dx*dx+dy*dy < r*r; }
/* ============================ SCENE SYSTEM ========================== */
const scenes = {}; let scene = null, sceneName = "";
function setScene(name) { if (scene && scene.exit) scene.exit(); sceneName = name; scene = scenes[name]; if (scene.enter) scene.enter(); }
const $ = id => document.getElementById(id);
const show = (el, on) => el.classList.toggle("hidden", !on);
/* ======================= ESTADO DEL JUEGO =========================== */
const state = {};
const lasers = pool(() => ({}), TUNING.bulletCap);
const enemies = pool(() => ({}), TUNING.enemyCap);
const bossShots = pool(() => ({}), 30);
const cores = pool(() => ({}), TUNING.coreCap);
const popups = pool(() => ({}), TUNING.popupCap);
const blocks = [];   // bloques del sky city (decorado 3D)
for (let i = 0; i < 26; i++) {
  blocks.push({ x: (rng()-0.5)*900, y: (rng()-0.5)*600, z: -rng()*900-100, w: 40+rng()*90, h: 40+rng()*90, c: ["#3d4a66","#4a5a80","#2e3a55","#5a6b8c"][i%4], d: rng() });
}
let best = 0;
function banner(text) {
  const el = $("banner");
  el.textContent = text; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  beep(720, 0.09, "triangle", 480);
}
function hudText() {
  const shields = "🛡".repeat(state.shields) || "—";
  $("hud").innerHTML =
    `<div class="core">◆ ${state.cores} <span class="cryst">✧ ${state.crystals}</span></div>` +
    `<div class="xp">XP ${state.xp} · NVL ${Math.floor(state.xp/10)+1}</div>` +
    `<div class="shields">${shields}</div>`;
}
function addPopup(x, y, text, color = "#ffd166") {
  popups.spawn(p => { p.x=x; p.y=y; p.text=text; p.color=color; p.life=p.maxLife=0.9; });
}
function resetGame() {
  state.px = 0; state.py = 0; state.vx = 0; state.vy = 0; state.aim = 0;
  state.shields = TUNING.shields; state.invuln = 0;
  state.cores = 0; state.crystals = 0; state.xp = 0; state.t = 0; state.timeScale = 1;
  state.wave = 1; state.waveDone = false; state.dead = false; state.deadT = 0;
  state.wave1Kills = 0; state.wave1SpawnT = 1.2;
  state.escort = null; state.escortSpawnT = 0; state.wave2Kills = 0;
  state.boss = null; state.bossShotT = 0;
  state.fireT = 0; state.weapon = 0;
  lasers.clear(); enemies.clear(); bossShots.clear(); cores.clear(); particles.clear(); popups.clear();
  cam.shake = 0;
  $("waveBar").style.opacity = 0; $("bossBarWrap").style.opacity = 0; $("escortBarWrap").style.opacity = 0;
  updateWeaponBtn();
}
function updateWeaponBtn() {
  const btn = $("weaponBtn");
  show(btn, sceneName === "play");
  btn.style.borderColor = state.weapon === 0 ? "#ff5470" : "#00c8ff";
  btn.style.color = state.weapon === 0 ? "#ff9c9c" : "#7df9ff";
  btn.innerHTML = state.weapon === 0 ? "PULSE<br>R1" : "MEGA<br>BEAM";
}
function setWaveBar(text) { $("waveBar").textContent = text; $("waveBar").style.opacity = 1; }
/* ── Proyección pseudo-3D ──────────────────────────────────────────── */
// Proyecta un punto (x,y,z) del mundo al plano de pantalla.
// sx, sy centrados en la pantalla; el jugador vive en z=0 (escala 1).
function project(x, y, z) {
  const s = TUNING.FOV / (TUNING.FOV - z);
  return { sx: VIEW.w/2 + x * s, sy: VIEW.h*0.64 + y * s, s: s };
}
/* ============================ ESCENAS =============================== */
scenes.menu = {
  enter(){ show($("menuScr"), true); show($("overScr"), false); show($("winScr"), false); show($("weaponBtn"), false); $("hud").textContent = ""; state.menuT = 0; },
  update(dt){ state.menuT += dt; },
  render(){ renderSky(state.menuT); },
  exit(){ show($("menuScr"), false); },
};
scenes.play = {
  enter(){ resetGame(); banner("MISIÓN 1 — DESTRUIR DRONES"); },
  update(dt) {
    dt *= state.timeScale;
    state.t += dt;
    if (input.weaponPressed) { state.weapon = 1 - state.weapon; updateWeaponBtn(); beep(500, 0.06, "sine"); }
    if (state.dead) {
      state.timeScale = Math.max(0.25, state.timeScale - dt * 2);
      state.deadT += dt;
      if (state.deadT > 0.7) setScene("gameover");
      updateWorld(dt); return;
    }
    updatePlayer(dt);
    updateWaves(dt);
    updateWorld(dt);
    if (state.waveDone) advanceWave();
  },
  render(){ renderWorld(); },
};
scenes.gameover = {
  enter(){ best = Math.max(best, state.cores); $("finalScore").innerHTML =
    `◆ <b>${state.cores}</b> Energy Cores · ✧ <b>${state.crystals}</b> Starlight · mejor ◆ <b>${best}</b><br><span style="opacity:.6;font-size:13px">Cayó en la misión ${state.wave} — ${["","DESTRUIR DRONES","ESCORTAR NAVE","OMEGA MEGA-BOT"][state.wave]}</span>`;
    show($("overScr"), true); },
  update(dt){ if (input.actionPressed) setScene("play"); },
  render(){ renderSky(state.t); renderParticles(); },
  exit(){ show($("overScr"), false); },
};
scenes.win = {
  enter(){ best = Math.max(best, state.cores); fanfare();
    $("winScore").innerHTML = `◆ <b>${state.cores}</b> Energy Cores · ✧ <b>${state.crystals}</b> Starlight · mejor ◆ <b>${best}</b>`;
    show($("winScr"), true); },
  update(dt){ if (input.actionPressed) setScene("play"); },
  render(){ renderSky(state.t); renderParticles(); },
  exit(){ show($("winScr"), false); },
};
/* ======================== LÓGICA DE JUEGO =========================== */
function updatePlayer(dt) {
  if (state.invuln > 0) state.invuln -= dt;
  state.vx += input.axis.x * TUNING.playerAccel * dt;
  state.vy += input.axis.y * TUNING.playerAccel * dt;
  const sp = Math.hypot(state.vx, state.vy), max = TUNING.playerSpeed;
  if (sp > max) { state.vx *= max/sp; state.vy *= max/sp; }
  if (!input.axis.x) state.vx -= state.vx * Math.min(TUNING.playerDrag*dt, 1);
  if (!input.axis.y) state.vy -= state.vy * Math.min(TUNING.playerDrag*dt, 1);
  state.px = Math.max(-180, Math.min(180, state.px + state.vx*dt));
  state.py = Math.max(-160, Math.min(160, state.py + state.vy*dt));
  // auto-aim: el enemigo más cercano (menor z → más grande en pantalla)
  let tx = null, td = TUNING.laserRange * 4;
  const consider = (en) => { const d = -en.z + Math.abs(en.x-state.px)*0.5 + Math.abs(en.y-state.py)*0.5; if (d < td) { td = d; tx = en; } };
  enemies.each(consider);
  if (state.boss && state.bossPhase === "vulnerable") consider(state.boss);
  state.fireT -= dt;
  if (tx && state.fireT <= 0) {
    state.fireT = TUNING.fireCooldown;
    const color = state.weapon === 0 ? "#ff5470" : "#00c8ff";
    if (state.weapon === 0) {
      lasers.spawn(l => { l.x=state.px; l.y=state.py; l.z=state.zOff||0; l.vz=TUNING.laserSpeed; l.color=color; });
      burst(VIEW.w/2, VIEW.h*0.64, color, 3, 90);
      beep(vary(320), 0.06, "square", 110);
    } else {
      for (let i = -1; i <= 1; i++) {
        lasers.spawn(l => { l.x=state.px+i*10; l.y=state.py; l.z=0; l.vz=TUNING.laserSpeed; l.color=color; l.big=true; });
      }
      burst(VIEW.w/2, VIEW.h*0.64, color, 5, 110);
      beep(vary(210), 0.1, "sawtooth", 80);
    }
  }
}
function updateWaves(dt) {
  if (state.wave === 1) {
    state.wave1SpawnT -= dt;
    if (state.wave1SpawnT <= 0 && enemies.count() < 5) {
      const remaining = TUNING.wave1Count - state.wave1Kills - enemies.count();
      if (remaining > 0) {
        state.wave1SpawnT = Math.max(0.55, TUNING.wave1SpawnEvery - state.t*0.005);
        spawnDrone();
      }
    }
    if (state.wave1Kills >= TUNING.wave1Count && enemies.count() === 0) state.waveDone = true;
  } else if (state.wave === 2) {
    if (!state.escort) {
      state.escort = { x: 90, y: 0, z: -140, hp: TUNING.escortHP, t: 0 };
      $("escortBarWrap").style.opacity = 1;
      banner("MISIÓN 2 — ESCORTAR NAVE");
    }
    const esc = state.escort;
    esc.t += dt;
    esc.z += 24 * dt;            // la escolta avanza contigo
    esc.x = 90 + Math.sin(esc.t*0.7) * 24;
    $("escortBar").style.width = (esc.hp / TUNING.escortHP * 100) + "%";
    state.escortSpawnT -= dt;

function updateWorld(dt) {
  // láseres: viajan hacia la profundidad (z negativo)
  lasers.each(l => {
    l.z -= l.vz * dt; l.age += dt;
    if (l.z < -560) l.alive = false;
  });
  // enemigos: avanzan hacia el jugador
  enemies.each(en => {
    en.t += dt;
    const speed = en.kind === "drone" ? TUNING.droneSpeed : TUNING.interSpeed;
    en.z += speed * dt;
    if (en.kind === "drone") {
      en.x += Math.sin(en.t*2 + en.phase) * 30 * dt;
      en.y += Math.cos(en.t*1.7 + en.phase) * 20 * dt;
    }
    if (en.z > 30) en.alive = false;   // pasó de largo
  });
  // proyectiles del boss
  bossShots.each(s => { s.z += s.vz * dt; s.age += dt; if (s.z > 30) s.alive = false; });
  // colisiones láser → enemigos (en el plano de profundidad del enemigo)
  lasers.each(l => {
    let hit = false;
    enemies.each(en => {
      if (!hit && en.alive && Math.abs(l.z - en.z) < 34) {
        const dx = l.x - en.x, dy = l.y - en.y;
        if (dx*dx + dy*dy < (TUNING.laserR + en.r) * (TUNING.laserR + en.r)) {
          hit = true; en.hp--;
          if (en.hp <= 0) killEnemy(en);
          else { const p = project(en.x,en.y,en.z); burst(p.sx,p.sy,"#fff",6,140); beep(vary(220),0.05,"square",140); }
          l.alive = false;
        }
      }
    });
    if (!hit && state.boss && state.bossPhase === "vulnerable" && Math.abs(l.z - state.boss.z) < 60) {
      const dx = l.x - state.boss.x, dy = l.y - state.boss.y;
      if (dx*dx + dy*dy < (TUNING.laserR + TUNING.bossR) * (TUNING.laserR + TUNING.bossR)) {
        state.boss.hp -= l.big ? 2 : 1; l.alive = false;
        const p = project(state.boss.x,state.boss.y,state.boss.z);
        burst(p.sx,p.sy,"#ff8c42",10,200); beep(vary(200),0.07,"square",120); cam.shake = Math.max(cam.shake, 2);
      }
    }
  });
  // enemigos/proyectiles → jugador (llegan al plano del jugador)
  const playerScreen = { sx: VIEW.w/2, sy: VIEW.h*0.64 };
  if (!state.dead && state.invuln <= 0) {
    enemies.each(en => {
      if (en.alive && Math.abs(en.z - TUNING.playerZ) < 30) {
        const p = project(en.x, en.y, en.z);
        if (hitCircle(p, playerScreen, en.r*0.8, TUNING.playerR)) { en.alive = false; killPlayer(); }
      }
    });
    bossShots.each(s => {
      if (s.alive && Math.abs(s.z - TUNING.playerZ) < 26) {
        const p = project(s.x, s.y, s.z);
        if (hitCircle(p, playerScreen, s.r, TUNING.playerR)) { s.alive = false; killPlayer("¡Impacto láser!"); }
      }
    });
  }
  // Energy Cores: magnetizan y vienen hacia el jugador
  cores.each(c => {
    c.age += dt;
    c.z += c.vz * dt;
    const p = project(c.x, c.y, c.z);
    const pj = project(state.px, state.py, TUNING.playerZ);
    const d = Math.hypot(p.sx - pj.sx, p.sy - pj.sy);
    if (d < TUNING.coreMagnetR * Math.max(0.4, Math.min(1, -c.z/300))) {
      c.x += (state.px - c.x) * 1.5 * dt;
      c.y += (state.py - c.y) * 1.5 * dt;
    }
    if (!state.dead && Math.abs(c.z) < 24 && d < 34) {
      c.alive = false;
      if (c.crystal) { state.crystals += TUNING.crystalBounty; addPopup(p.sx, p.sy-12, "+" + TUNING.crystalBounty + " ✧", "#ff6bd6"); }
      else { state.cores += TUNING.coreValue; addPopup(p.sx, p.sy-12, "+" + TUNING.coreValue + " ◆", "#ffd166"); }
      pickupChime(); hudText();
    }
    if (c.age > 10 || c.z > 40) c.alive = false;
  });
  popups.each(p => { p.age += dt; p.life -= dt; p.y -= 40 * dt; if (p.life <= 0) p.alive = false; });

function renderSky(t) {

function renderBlocks() {

    ctx.fillStyle = "#fff"; ctx.font = "700 26px system-ui"; ctx.textAlign = "center";
    ctx.fillText("PAUSADO — toca para reanudar", VIEW.w/2, VIEW.h/2);
  }
}
setScene("menu"); requestAnimationFrame(frame);
</script>
