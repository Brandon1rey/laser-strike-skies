<!DOCTYPE html>
<!-- Laser Strike Skies — clon WEB jugable del juego Roblox (spec v1.0.0-alpha)
     Core verb: volar + láser auto-aim. 3 misiones del spec:
     DESTRUIR DRONES → ESCORTAR NAVE → OMEGA MEGA-BOT (3 fases).
     Armas del registro: Pulse Laser R1 (rojo) / Mega-Beam (cian, Q o botón).
     Monedas del DataStore: Energy Cores (◆) + Starlight Crystals (✧), XP/NVL.
     Mobile-first: canvas rota portrait (480x800) / landscape (800x480),
     joystick táctil, botones ≥44px. Motor: esqueleto game-forge. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Laser Strike Skies — Web Demo</title>
<style>
  html,body{margin:0;height:100%;background:#070a14;overflow:hidden;font-family:system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#070a14;touch-action:none;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;color:#e8f0ff;user-select:none;-webkit-user-select:none}
  #hud{position:absolute;top:10px;left:14px;font:700 17px/1.3 system-ui;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px #000}
  #hud .core{color:#ffd166;font-size:21px}
  #hud .cryst{color:#ff6bd6;font-size:14px}
  #hud .xp{color:#7df9ff;font-size:12px;opacity:.9}
  #hud .shields{font-size:14px;letter-spacing:2px}
  #waveBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;font:800 14px system-ui;letter-spacing:.14em;color:#9fe8ff;text-shadow:0 0 14px #0ff8;opacity:0;transition:opacity .3s;white-space:nowrap}
  #bossBarWrap{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:min(340px,56vw);height:9px;background:#241a30;border:1px solid #ff5470aa;border-radius:6px;opacity:0;transition:opacity .3s}
  #bossBar{height:100%;width:100%;background:linear-gradient(90deg,#ff5470,#ff8c42);border-radius:6px;transition:width .15s}
  #escortBarWrap{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:min(340px,56vw);height:9px;background:#241a30;border:1px solid #7df9ffaa;border-radius:6px;opacity:0;transition:opacity .3s}
  #escortBar{height:100%;width:100%;background:linear-gradient(90deg,#7df9ff,#4dd0ff);border-radius:6px;transition:width .15s}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(5,7,16,.6)}
  .screen h1{font:900 min(8vw,46px) system-ui;letter-spacing:.08em;margin:0;color:#7df9ff;text-shadow:0 0 28px #0ff8}
  .screen h1 .strike{color:#ff5470;text-shadow:0 0 28px #f05}
  .screen p{margin:0;opacity:.85;font-size:15px;padding:0 26px;line-height:1.5}
  .screen .core-note{color:#ffd166}
  .btn{pointer-events:auto;border:2px solid #7df9ff;background:transparent;color:#7df9ff;font:700 18px system-ui;padding:14px 38px;border-radius:10px;cursor:pointer;min-width:44px;min-height:44px}
  .btn:active{background:#7df9ff22}
  #mute{position:absolute;top:10px;right:14px;pointer-events:auto;opacity:.7;font-size:22px;background:none;border:none;color:#e8f0ff;cursor:pointer;min-width:44px;min-height:44px}
  .hidden{display:none !important}
  #banner{position:absolute;top:36%;left:0;right:0;text-align:center;font:900 30px system-ui;letter-spacing:.12em;color:#fff;text-shadow:0 0 30px #7df9ff;opacity:0;pointer-events:none;padding:0 10px}
  #banner.show{animation:bannerIn 1.6s ease forwards}
  @keyframes bannerIn{0%{opacity:0;transform:translateY(24px) scale(.94)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  #weaponBtn{position:absolute;bottom:24px;right:20px;pointer-events:auto;min-width:64px;min-height:64px;border-radius:50%;border:2px solid #ff5470;background:rgba(20,10,20,.7);color:#ff8c8c;font:700 12px system-ui;letter-spacing:.05em}
  #winScr h1{color:#7dffa8;text-shadow:0 0 28px #2f28}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="ui">
  <div id="hud"></div>
  <div id="waveBar"></div>
  <div id="escortBarWrap"><div id="escortBar"></div></div>
  <div id="bossBarWrap"><div id="bossBar"></div></div>
  <button id="mute" aria-label="mute">🔊</button>
  <button id="weaponBtn" class="hidden">PULSE<br>R1</button>
  <div id="banner"></div>
  <div id="menuScr" class="screen">
    <h1>LASER <span class="strike">STRIKE</span> SKIES</h1>
    <p>Clon web del juego Roblox — vuela y deja que el láser apunte solo.<br>
    <span class="core-note">◆ Energy Cores</span> + <span style="color:#ff6bd6">✧ Starlight</span> por misión. 3 misiones: Drones · Escolta · <b>Omega Mega-Bot</b>.</p>
    <p style="font-size:13px;opacity:.6">WASD/flechas · en móvil: joystick táctil · Q o botón para cambiar arma</p>
    <button class="btn" id="startBtn">DESPLEGAR</button>
  </div>
  <div id="overScr" class="screen hidden">
    <h1 style="color:#ff5470">MISIÓN FALLIDA</h1>
    <p id="finalScore"></p>
    <button class="btn" id="retryBtn">REINTENTAR</button>
  </div>
  <div id="winScr" class="screen hidden">
    <h1>MISIÓN COMPLETA</h1>
    <p id="winScore"></p>
    <button class="btn" id="againBtn">OTRA SALIDA</button>
  </div>
</div>
<script>
"use strict";
/* ============================== TUNING ============================== */
const TUNING = {
  playerSpeed: 320, playerAccel: 2400, playerDrag: 4.5, playerR: 14,
  laserRange: 340, fireCooldown: 0.14, laserSpeed: 900, laserR: 4,
  shields: 3, invulnTime: 1.3,
  // bestiario spec: Sentry Drone v2 (150 HP en Roblox → 1 hit web)
  droneHP: 1, droneR: 15, droneSpeed: 70, droneBounty: 1,
  interHP: 2, interR: 13, interSpeed: 150, interBounty: 2,
  escortHP: 5, escortSpeed: 60, escortR: 22,
  // Omega Mega-Bot (12000 HP/25 armor en Roblox → fase web)
  bossHP: 30, bossR: 46, bossBounty: 10,
  bossPhaseIdle: 0.8, bossTelegraph: 0.55, bossVuln: 2.2, bossVolley: 3,
  wave1Count: 8, wave1SpawnEvery: 1.15,
  wave2SpawnEvery: 0.95, wave2Interceptors: 9,
  coreDropChance: 0.45, coreValue: 10, crystalBounty: 5, coreMagnetR: 90,
  shakeHit: 6, shakeHitPlayer: 14, shakeDeath: 20,
  particleCap: 380, bulletCap: 90, enemyCap: 60, coreCap: 40, popupCap: 24,
  masterVolume: 0.3,
};
/* ============================ CANVAS & DPR =========================== */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const VIEW = { w: 800, h: 480 };   // landscape default; rota a portrait en móvil vertical
function orientView() {
  const portrait = innerHeight > innerWidth;
  VIEW.w = portrait ? 480 : 800;
  VIEW.h = portrait ? 800 : 480;
  resize();
}
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const scale = Math.min(innerWidth / VIEW.w, innerHeight / VIEW.h);
  cv.style.width = VIEW.w * scale + "px"; cv.style.height = VIEW.h * scale + "px";
  cv.width = Math.round(VIEW.w * scale * dpr); cv.height = Math.round(VIEW.h * scale * dpr);
  ctx.setTransform(cv.width / VIEW.w, 0, 0, cv.height / VIEW.h, 0, 0);
}
addEventListener("resize", orientView); addEventListener("orientationchange", orientView);
/* ============================ SEEDED RNG =========================== */
let rngState = 20260802;
function rng() { rngState = (rngState * 1664525 + 1013904223) >>> 0; return rngState / 4294967296; }
/* =============================== AUDIO ============================== */
let AC = null, masterGain = null, muted = false;
function audioInit() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = AC.createGain(); masterGain.gain.value = TUNING.masterVolume; masterGain.connect(AC.destination);
}
function beep(freq, dur, type = "square", slideTo = null, vol = 1) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + dur + 0.02);
}
const vary = f => f * (0.9 + rng() * 0.2);
function pickupChime() { [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, 0.06, "sine"), i * 55)); }
function fanfare() { [392, 523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.14, "triangle"), i * 90)); }
document.getElementById("mute").onclick = e => { muted = !muted; e.target.textContent = muted ? "🔇" : "🔊"; };
/* =============================== INPUT ============================== */
const input = { axis: {x:0, y:0}, action: false, actionPressed: false, weaponPressed: false };
const keys = {};
const KEYMAP = { KeyW:"up", ArrowUp:"up", KeyS:"down", ArrowDown:"down", KeyA:"left", ArrowLeft:"left", KeyD:"right", ArrowRight:"right", KeyQ:"weapon", Space:"act", Enter:"act" };
addEventListener("keydown", e => {
  const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); audioInit();
  if (k === "weapon" && !keys.weapon) input.weaponPressed = true;
  if (k === "act" && !keys.act) input.actionPressed = true;
  keys[k] = true;
});
addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
const touch = { joyId: null, joyOx: 0, joyOy: 0, joyX: 0, joyY: 0 };
function cvPos(t){ const r = cv.getBoundingClientRect(); return { x: (t.clientX - r.left) / r.width * VIEW.w, y: (t.clientY - r.top) / r.height * VIEW.h }; }
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); audioInit();
  if (touch.joyId === null) { touch.joyId = e.pointerId; const p = cvPos(e); touch.joyOx = p.x; touch.joyOy = p.y; touch.joyX = p.x; touch.joyY = p.y; }
});
cv.addEventListener("pointermove", e => { if (e.pointerId === touch.joyId) { const p = cvPos(e); touch.joyX = p.x; touch.joyY = p.y; } });
function endPointer(e){ if (e.pointerId === touch.joyId) touch.joyId = null; }
cv.addEventListener("pointerup", endPointer); cv.addEventListener("pointercancel", endPointer);
document.getElementById("weaponBtn").addEventListener("click", () => { audioInit(); input.weaponPressed = true; });
function pollInput() {
  let x = (keys.right?1:0) - (keys.left?1:0), y = (keys.down?1:0) - (keys.up?1:0);
  if (touch.joyId !== null) {
    const dx = touch.joyX - touch.joyOx, dy = touch.joyY - touch.joyOy, d = Math.hypot(dx, dy), R = 52;
    if (d > 6) { const k = Math.min(d / R, 1) / d; x = dx * k; y = dy * k; }
  }
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  input.axis.x = x; input.axis.y = y;
}
/* =============================== POOL =============================== */
function pool(factory, cap) {
  const items = [];
  return {
    items, cap,
    spawn(init) {
      let it = items.find(i => !i.alive);
      if (!it) { if (items.length >= cap) { it = items.reduce((a,b)=>a.age>b.age?a:b); } else { it = factory(); items.push(it); } }
      it.alive = true; it.age = 0; init(it); return it;
    },
    each(fn) { for (let i = 0; i < items.length; i++) if (items[i].alive) fn(items[i]); },
    count() { let n = 0; for (const i of items) if (i.alive) n++; return n; },
    clear() { for (const i of items) i.alive = false; },
  };
}
/* ========================= CAMERA & PARTICLES ======================= */
const cam = { x: 0, y: 0, shake: 0 };
const particles = pool(() => ({}), TUNING.particleCap);
function burst(x, y, color, n = 12, speed = 220) {
  for (let i = 0; i < n; i++) {
    const a = rng() * Math.PI * 2, s = speed * (0.3 + rng() * 0.7);
    particles.spawn(p => { p.x=x; p.y=y; p.vx=Math.cos(a)*s; p.vy=Math.sin(a)*s; p.r=2+rng()*3; p.life=p.maxLife=0.35+rng()*0.35; p.color=color; });
  }
}
function updateParticles(dt) {
  particles.each(p => { p.age+=dt; p.life-=dt; if (p.life<=0) { p.alive=false; return; } p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96; });
}
function renderParticles() {
  ctx.globalCompositeOperation = "lighter";
  particles.each(p => { ctx.globalAlpha = p.life/p.maxLife; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,7); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}
/* ============================= COLLISION ============================ */
const hitCircle = (a, b, ra, rb) => { const dx=a.x-b.x, dy=a.y-b.y, r=ra+rb; return dx*dx+dy*dy < r*r; };
function hitSweep(a, prevX, prevY, b, ra, rb) {
  const steps = Math.ceil(Math.hypot(a.x-prevX, a.y-prevY) / Math.max(rb, 4));
  for (let i = 1; i <= steps; i++) { const t=i/steps, px=prevX+(a.x-prevX)*t, py=prevY+(a.y-prevY)*t, dx=px-b.x, dy=py-b.y, r=ra+rb; if (dx*dx+dy*dy<r*r) return true; }
  return false;
}
/* ============================ SCENE SYSTEM ========================== */
const scenes = {}; let scene = null, sceneName = "";
function setScene(name) { if (scene && scene.exit) scene.exit(); sceneName = name; scene = scenes[name]; if (scene.enter) scene.enter(); }
const $ = id => document.getElementById(id);
const show = (el, on) => el.classList.toggle("hidden", !on);
/* ======================= ESTADO DEL JUEGO =========================== */
const state = {};
const lasers = pool(() => ({}), TUNING.bulletCap);
const enemies = pool(() => ({}), TUNING.enemyCap);
const bossShots = pool(() => ({}), 30);
const cores = pool(() => ({}), TUNING.coreCap);
const popups = pool(() => ({}), TUNING.popupCap);
let best = 0;
function banner(text) {
  const el = $("banner");
  el.textContent = text; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  beep(720, 0.09, "triangle", 480);
}
function hudText() {
  const shields = "🛡".repeat(state.shields) || "—";
  $("hud").innerHTML =
    `<div class="core">◆ ${state.cores} <span class="cryst">✧ ${state.crystals}</span></div>` +
    `<div class="xp">XP ${state.xp} · NVL ${Math.floor(state.xp/10)+1}</div>` +
    `<div class="shields">${shields}</div>`;
}
function addPopup(x, y, text, color = "#ffd166") {
  popups.spawn(p => { p.x=x; p.y=y; p.text=text; p.color=color; p.life=p.maxLife=0.9; });
}
function resetGame() {
  state.px = VIEW.w/2; state.py = VIEW.h/2; state.vx = 0; state.vy = 0; state.aim = 0;
  state.shields = TUNING.shields; state.invuln = 0;
  state.cores = 0; state.crystals = 0; state.xp = 0; state.t = 0; state.timeScale = 1;
  state.wave = 1; state.waveDone = false; state.dead = false; state.deadT = 0;
  state.wave1Kills = 0; state.wave1SpawnT = 1.0;
  state.escort = null; state.escortSpawnT = 0; state.wave2Kills = 0;
  state.boss = null; state.bossShotT = 0; state.bossPhase = "spawn";
  state.fireT = 0; state.weapon = 0;  // 0=Pulse Laser R1, 1=Mega-Beam
  lasers.clear(); enemies.clear(); bossShots.clear(); cores.clear(); particles.clear(); popups.clear();
  cam.shake = 0;
  $("waveBar").style.opacity = 0; $("bossBarWrap").style.opacity = 0; $("escortBarWrap").style.opacity = 0;
  updateWeaponBtn();
}
function updateWeaponBtn() {
  const btn = $("weaponBtn");
  show(btn, sceneName === "play");
  btn.style.borderColor = state.weapon === 0 ? "#ff5470" : "#00c8ff";
  btn.style.color = state.weapon === 0 ? "#ff8c8c" : "#7df9ff";
  btn.innerHTML = state.weapon === 0 ? "PULSE<br>R1" : "MEGA<br>BEAM";
}
function setWaveBar(text) { $("waveBar").textContent = text; $("waveBar").style.opacity = 1; }
/* ============================ ESCENAS =============================== */
scenes.menu = {
  enter(){ show($("menuScr"), true); show($("overScr"), false); show($("winScr"), false); show($("weaponBtn"), false); $("hud").textContent = ""; state.menuT = 0; },
  update(dt){ state.menuT += dt; },
  render(){ drawBg(state.menuT, 0.6); },
  exit(){ show($("menuScr"), false); },
};
scenes.play = {
  enter(){ resetGame(); banner("MISIÓN 1 — DESTRUIR DRONES"); },
  update(dt) {
    dt *= state.timeScale;
    state.t += dt;
    if (input.weaponPressed) { state.weapon = 1 - state.weapon; updateWeaponBtn(); beep(500, 0.06, "sine"); }
    if (state.dead) {
      state.timeScale = Math.max(0.25, state.timeScale - dt * 2);
      state.deadT += dt;
      if (state.deadT > 0.7) setScene("gameover");
      updateWorld(dt); return;
    }
    updatePlayer(dt);
    updateWaves(dt);
    updateWorld(dt);
    if (state.waveDone) advanceWave();
  },
  render(){ renderWorld(); },
};
scenes.gameover = {
  enter(){ best = Math.max(best, state.cores); $("finalScore").innerHTML =
    `◆ <b>${state.cores}</b> Energy Cores · ✧ <b>${state.crystals}</b> Starlight · mejor ◆ <b>${best}</b><br><span style="opacity:.6;font-size:13px">Cayó en la misión ${state.wave} — ${["","DESTRUIR DRONES","ESCORTAR NAVE","OMEGA MEGA-BOT"][state.wave]}</span>`;
    show($("overScr"), true); },
  update(dt){ if (input.actionPressed) setScene("play"); },
  render(){ drawBg(state.t, 0.4); renderParticles(); },
  exit(){ show($("overScr"), false); },
};
scenes.win = {
  enter(){ best = Math.max(best, state.cores); fanfare();
    $("winScore").innerHTML = `◆ <b>${state.cores}</b> Energy Cores · ✧ <b>${state.crystals}</b> Starlight · mejor ◆ <b>${best}</b>`;
    show($("winScr"), true); },
  update(dt){ if (input.actionPressed) setScene("play"); },
  render(){ drawBg(state.t, 0.7); renderParticles(); },
  exit(){ show($("winScr"), false); },
};
/* ======================== LÓGICA DE JUEGO =========================== */
function updatePlayer(dt) {
  if (state.invuln > 0) state.invuln -= dt;
  state.vx += input.axis.x * TUNING.playerAccel * dt;
  state.vy += input.axis.y * TUNING.playerAccel * dt;
  const sp = Math.hypot(state.vx, state.vy), max = TUNING.playerSpeed;
  if (sp > max) { state.vx *= max/sp; state.vy *= max/sp; }
  if (!input.axis.x) state.vx -= state.vx * Math.min(TUNING.playerDrag*dt, 1);
  if (!input.axis.y) state.vy -= state.vy * Math.min(TUNING.playerDrag*dt, 1);
  state.px = Math.max(22, Math.min(VIEW.w-22, state.px + state.vx*dt));
  state.py = Math.max(22, Math.min(VIEW.h-22, state.py + state.vy*dt));
  // auto-aim
  let tx = null, td = TUNING.laserRange;
  const consider = (en) => { const d = Math.hypot(en.x-state.px, en.y-state.py); if (d < td) { td = d; tx = en; } };
  enemies.each(consider);
  if (state.boss && state.bossPhase === "vulnerable") consider(state.boss);
  state.fireT -= dt;
  if (tx && state.fireT <= 0) {
    state.fireT = TUNING.fireCooldown;
    const a = Math.atan2(tx.y - state.py, tx.x - state.px);
    state.aim = a;
    const color = state.weapon === 0 ? "#ff5470" : "#00c8ff";
    if (state.weapon === 0) {
      lasers.spawn(l => { l.x=state.px+Math.cos(a)*20; l.y=state.py+Math.sin(a)*20; l.px=l.x; l.py=l.y; l.vx=Math.cos(a)*TUNING.laserSpeed; l.vy=Math.sin(a)*TUNING.laserSpeed; l.color=color; });
      burst(state.px+Math.cos(a)*24, state.py+Math.sin(a)*24, color, 3, 90);
      beep(vary(320), 0.06, "square", 110);
    } else {
      // Mega-Beam: rayo ancho, daño por tick (3 rayos paralelos)
      for (let i = -1; i <= 1; i++) {
        const off = i * 6;
        lasers.spawn(l => {
          const ang = a;
          l.x=state.px+Math.cos(ang)*20 + Math.cos(ang+Math.PI/2)*off;
          l.y=state.py+Math.sin(ang)*20 + Math.sin(ang+Math.PI/2)*off;
          l.px=l.x; l.py=l.y; l.vx=Math.cos(ang)*TUNING.laserSpeed; l.vy=Math.sin(ang)*TUNING.laserSpeed; l.color=color; l.big=true;
        });
      }
      burst(state.px+Math.cos(a)*24, state.py+Math.sin(a)*24, color, 5, 110);
      beep(vary(210), 0.1, "sawtooth", 80);
    }
  }
}
function updateWaves(dt) {
  if (state.wave === 1) {
    state.wave1SpawnT -= dt;
    if (state.wave1SpawnT <= 0 && enemies.count() < 6) {
      const remaining = TUNING.wave1Count - state.wave1Kills - enemies.count();
      if (remaining > 0) {
        state.wave1SpawnT = Math.max(0.5, TUNING.wave1SpawnEvery - state.t*0.004);
        spawnDrone();
      }
    }
    if (state.wave1Kills >= TUNING.wave1Count && enemies.count() === 0) state.waveDone = true;
  } else if (state.wave === 2) {
    if (!state.escort) {
      state.escort = { x: -40, y: VIEW.h*0.5 + (rng()-0.5)*80, hp: TUNING.escortHP, t: 0 };
      $("escortBarWrap").style.opacity = 1;
      banner("MISIÓN 2 — ESCORTAR NAVE");
    }
    const esc = state.escort;
    esc.t += dt;
    esc.x += TUNING.escortSpeed * dt;
    esc.y += Math.sin(esc.t * 0.8) * 22 * dt;
    $("escortBar").style.width = (esc.hp / TUNING.escortHP * 100) + "%";
    state.escortSpawnT -= dt;
    if (state.escortSpawnT <= 0 && state.wave2Kills + enemies.count() < TUNING.wave2Interceptors) {
      state.escortSpawnT = TUNING.wave2SpawnEvery;
      spawnInterceptor();
    }
    enemies.each(en => {
      if (en.kind === "inter") {
        const a = Math.atan2(esc.y - en.y, esc.x - en.x);
        en.vx = Math.cos(a) * TUNING.interSpeed; en.vy = Math.sin(a) * TUNING.interSpeed;
        if (hitCircle(en, esc, TUNING.interR, TUNING.escortR)) {
          en.alive = false; esc.hp--; burst(en.x, en.y, "#ff8c42", 10, 200);
          beep(150, 0.09, "sawtooth", 70); cam.shake = Math.max(cam.shake, TUNING.shakeHit);
          if (esc.hp <= 0) { killPlayer("¡La escolta fue destruida!"); }
        }
      }
    });
    if (esc.x > VIEW.w + 50) { state.waveDone = true; $("escortBarWrap").style.opacity = 0; }
  } else if (state.wave === 3) {
    if (!state.boss) {
      state.boss = { x: VIEW.w/2, y: VIEW.h/2, hp: TUNING.bossHP, phase: "idle", t: TUNING.bossPhaseIdle, fireT: 0 };
      $("bossBarWrap").style.opacity = 1;
      banner("MISIÓN 3 — OMEGA MEGA-BOT");
      beep(80, 0.8, "sawtooth", 30);
    }
    const boss = state.boss;
    $("bossBar").style.width = (boss.hp / TUNING.bossHP * 100) + "%";
    boss.t -= dt;
    if (boss.phase === "idle") {
      boss.x += Math.sin(state.t * 0.7) * 60 * dt;
      boss.y += Math.cos(state.t * 0.5) * 40 * dt;
      if (boss.t <= 0) { boss.phase = "telegraph"; boss.t = TUNING.bossTelegraph; beep(240, 0.3, "sawtooth", 120); }
    } else if (boss.phase === "telegraph") {
      if (boss.t <= 0) { boss.phase = "fire"; boss.t = 0.1; }
    } else if (boss.phase === "fire") {
      boss.t -= dt;
      boss.fireT -= dt;
      if (boss.fireT <= 0) {
        boss.fireT = 0.28;
        const a = Math.atan2(state.py - boss.y, state.px - boss.x);
        for (let i = -1; i <= 1; i++) {
          bossShots.spawn(s => {
            const ang = a + i * 0.22;
            s.x = boss.x; s.y = boss.y; s.vx = Math.cos(ang) * 190; s.vy = Math.sin(ang) * 190; s.r = 6;
          });
        }
        beep(vary(180), 0.12, "square", 60);
      }
      if (boss.t <= 0) { boss.phase = "vulnerable"; boss.t = TUNING.bossVuln; }
    } else if (boss.phase === "vulnerable") {
      boss.x += Math.sin(state.t * 0.7) * 60 * dt;
      if (boss.t <= 0) { boss.phase = "idle"; boss.t = TUNING.bossPhaseIdle; }
    }
    if (boss.hp <= 0) { state.waveDone = true; $("bossBarWrap").style.opacity = 0; }
  }
}
function advanceWave() {
  state.waveDone = false;
  if (state.wave === 1) { state.wave = 2; }
  else if (state.wave === 2) { state.wave = 3; }
  else if (state.wave === 3) { setScene("win"); return; }
}
function spawnDrone() {
  const side = Math.floor(rng() * 4);
  const x = side === 0 ? -20 : side === 1 ? VIEW.w + 20 : rng() * VIEW.w;
  const y = side === 2 ? -20 : side === 3 ? VIEW.h + 20 : rng() * VIEW.h;
  enemies.spawn(en => {
    en.kind = "drone"; en.x = x; en.y = y; en.hp = TUNING.droneHP; en.r = TUNING.droneR;
    en.vx = 0; en.vy = 0; en.phase = rng() * 7; en.t = 0;
  });
}
function spawnInterceptor() {
  const side = Math.floor(rng() * 4);
  const x = side === 0 ? -20 : side === 1 ? VIEW.w + 20 : rng() * VIEW.w;
  const y = side === 2 ? -20 : side === 3 ? VIEW.h + 20 : rng() * VIEW.h;
  enemies.spawn(en => {
    en.kind = "inter"; en.x = x; en.y = y; en.hp = TUNING.interHP; en.r = TUNING.interR;
    en.vx = 0; en.vy = 0; en.phase = rng() * 7; en.t = 0;
  });
}
function killEnemy(en) {
  en.alive = false;
  state.wave === 1 ? state.wave1Kills++ : state.wave2Kills++;
  const bounty = en.kind === "drone" ? TUNING.droneBounty : TUNING.interBounty;
  state.xp += bounty * 5;
  burst(en.x, en.y, "#ff5470", 16, 260);
  beep(vary(150), 0.11, "sawtooth", 45); cam.shake = Math.max(cam.shake, TUNING.shakeHit);
  if (rng() < TUNING.coreDropChance) {
    cores.spawn(c => { c.x = en.x; c.y = en.y; c.vx = (rng()-0.5)*60; c.vy = (rng()-0.5)*60; c.crystal = rng() < 0.15; });
  } else {
    addPopup(en.x, en.y - 14, "+" + bounty * 5 + " XP", "#7df9ff");
  }
  hudText();
}
function killPlayer(reason) {
  if (state.invuln > 0 || state.dead) return;
  state.shields--;
  hudText();
  if (state.shields <= 0) {
    state.dead = true; state.deadT = 0;
    burst(state.px, state.py, "#7df9ff", 30, 380);
    burst(state.px, state.py, "#ff5470", 22, 300);
    beep(200, 0.7, "sawtooth", 40); cam.shake = TUNING.shakeDeath;
    if (reason) addPopup(state.px, state.py - 30, reason, "#ff5470");
  } else {
    state.invuln = TUNING.invulnTime;
    burst(state.px, state.py, "#ff5470", 14, 220);
    beep(260, 0.25, "sawtooth", 90); cam.shake = Math.max(cam.shake, TUNING.shakeHitPlayer);
    if (reason) addPopup(state.px, state.py - 30, reason, "#ff5470");
  }
}
function updateWorld(dt) {
  lasers.each(l => {
    l.px = l.x; l.py = l.y; l.x += l.vx * dt; l.y += l.vy * dt; l.age += dt;
    if (l.x < -30 || l.x > VIEW.w + 30 || l.y < -30 || l.y > VIEW.h + 30) l.alive = false;
  });
  enemies.each(en => {
    en.t += dt;
    if (en.kind === "drone") {
      const a = Math.atan2(state.py - en.y, state.px - en.x) + Math.sin(en.t * 2.4 + en.phase) * 0.6;
      en.vx = Math.cos(a) * TUNING.droneSpeed; en.vy = Math.sin(a) * TUNING.droneSpeed;
    }
    en.x += en.vx * dt; en.y += en.vy * dt; en.age += dt;
    if (en.x < -40 || en.x > VIEW.w + 40 || en.y < -40 || en.y > VIEW.h + 40) en.alive = false;
  });
  bossShots.each(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.age += dt;
    if (s.x < -20 || s.x > VIEW.w+20 || s.y < -20 || s.y > VIEW.h+20) s.alive = false; });
  lasers.each(l => {
    let hit = false;
    enemies.each(en => { if (!hit && en.alive && hitSweep(l, l.px, l.py, en, TUNING.laserR, en.r)) { hit = true; en.hp--; if (en.hp <= 0) killEnemy(en); else { burst(l.x, l.y, "#fff", 6, 140); beep(vary(220), 0.05, "square", 140); } l.alive = false; } });
    if (!hit && state.boss && state.bossPhase === "vulnerable" && hitSweep(l, l.px, l.py, state.boss, TUNING.laserR, TUNING.bossR)) {
      state.boss.hp -= l.big ? 2 : 1; l.alive = false;
      burst(l.x, l.y, "#ff8c42", 10, 200); beep(vary(200), 0.07, "square", 120); cam.shake = Math.max(cam.shake, 2);
    }
  });
  if (!state.dead && state.invuln <= 0) {
    enemies.each(en => { if (en.alive && hitCircle(en, {x:state.px,y:state.py}, en.r*0.85, TUNING.playerR)) { en.alive = false; killPlayer(); } });
    bossShots.each(s => { if (s.alive && hitCircle(s, {x:state.px,y:state.py}, s.r, TUNING.playerR)) { s.alive = false; killPlayer("¡Impacto láser!"); } });
  }
  cores.each(c => {
    c.age += dt;
    const d = Math.hypot(state.px - c.x, state.py - c.y);
    if (d < TUNING.coreMagnetR) { c.vx += (state.px - c.x) * 6 * dt; c.vy += (state.py - c.y) * 6 * dt; }
    c.x += c.vx * dt; c.y += c.vy * dt;
    if (!state.dead && d < 26) {
      c.alive = false;
      if (c.crystal) { state.crystals += TUNING.crystalBounty; addPopup(c.x, c.y - 12, "+" + TUNING.crystalBounty + " ✧", "#ff6bd6"); }
      else { state.cores += TUNING.coreValue; addPopup(c.x, c.y - 12, "+" + TUNING.coreValue + " ◆", "#ffd166"); }
      pickupChime(); hudText();
    }
    if (c.age > 12) c.alive = false;
  });
  popups.each(p => { p.age += dt; p.life -= dt; p.y -= 40 * dt; if (p.life <= 0) p.alive = false; });
  updateParticles(dt);
  cam.shake *= 0.88;
}
/* ============================== RENDER ============================== */
function drawBg(t, dim = 1) {
  const g = ctx.createLinearGradient(0, 0, 0, VIEW.h);
  g.addColorStop(0, "#0a0e1e"); g.addColorStop(1, "#131031");
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW.w, VIEW.h);
  ctx.fillStyle = "rgba(160,190,255," + (0.5*dim) + ")";
  for (let i = 0; i < 50; i++) {
    const x = ((i * 97.31) % VIEW.w);
    const y = ((i * 57.17 + t * 6) % (VIEW.h + 20)) - 10;
    ctx.fillRect(x, y, 1.6, 1.6);
  }
  ctx.fillStyle = "rgba(40,60,110," + (0.55*dim) + ")";
  for (let i = 0; i < 7; i++) {
    const w = 60 + (i * 37) % 70, h = 80 + (i * 53) % 90;
    const x = ((i * 140 - t * 10) % (VIEW.w + 200)) - 100;
    const y = VIEW.h - 60 - ((i * 41) % 50);
    ctx.fillRect(x, y, w, h);
    ctx.fillRect(x + w * 0.3, y - 16, w * 0.4, 16);
  }
  ctx.fillStyle = "rgba(90,120,190," + (0.35*dim) + ")";
  for (let i = 0; i < 4; i++) {
    const w = 120 + (i * 61) % 90;
    const x = ((i * 260 - t * 22) % (VIEW.w + 300)) - 150;
    const y = 60 + (i * 97) % 140;
    ctx.fillRect(x, y, w, 8);
  }
}
function drawShip(x, y, angle, color, r = 20, thrust = false) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(r * 1.5, 0); ctx.lineTo(-r * 0.9, r * 0.9); ctx.lineTo(-r * 0.45, 0); ctx.lineTo(-r * 0.9, -r * 0.9); ctx.closePath(); ctx.fill();
  if (thrust) {
    ctx.shadowBlur = 22; ctx.fillStyle = "#9fe8ff";
    ctx.beginPath(); ctx.moveTo(-r * 0.9, r * 0.35); ctx.lineTo(-r * 1.7, 0); ctx.lineTo(-r * 0.9, -r * 0.35); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function renderWorld() {
  drawBg(state.t);
  ctx.save();
  ctx.translate((rng()-0.5)*cam.shake, (rng()-0.5)*cam.shake);
  if (state.escort) {
    drawShip(state.escort.x, state.escort.y, 0, "#4dd0ff", TUNING.escortR);
    ctx.shadowColor = "#4dd0ff"; ctx.shadowBlur = 8; ctx.strokeStyle = "#4dd0ffaa"; ctx.lineWidth = 1.5;
    ctx.strokeRect(state.escort.x - 34, state.escort.y - 30, 68, 60); ctx.shadowBlur = 0;
  }
  if (state.boss) {
    const b = state.boss;
    const vulnerable = b.phase === "vulnerable";
    const telegraphing = b.phase === "telegraph";
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(state.t * 0.4);
    ctx.shadowColor = vulnerable ? "#ffd166" : "#ff5470"; ctx.shadowBlur = telegraphing ? 34 : 20;
    ctx.strokeStyle = vulnerable ? "#ffd166" : "#ff5470"; ctx.lineWidth = 4;
    ctx.fillStyle = vulnerable ? "#ffd16622" : "#ff547022";
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = TUNING.bossR + (vulnerable ? 4 : Math.sin(state.t * 3 + i) * 3); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = telegraphing ? "#fff" : "#ff5470";
    ctx.shadowColor = telegraphing ? "#fff" : "#ff5470"; ctx.shadowBlur = telegraphing ? 26 : 10;
    ctx.beginPath(); ctx.arc(0, 0, telegraphing ? 12 : 9, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.restore();
  }
  ctx.shadowColor = "#ff5470"; ctx.shadowBlur = 10; ctx.fillStyle = "#ff8c8c";
  bossShots.each(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); });
  enemies.each(en => {
    if (en.kind === "drone") {
      ctx.save(); ctx.translate(en.x, en.y); ctx.rotate(en.t * 3 + en.phase);
      ctx.shadowColor = "#ff5470"; ctx.shadowBlur = 12; ctx.strokeStyle = "#ff5470"; ctx.lineWidth = 2.5;
      ctx.strokeRect(-en.r, -en.r, en.r * 2, en.r * 2);
      ctx.fillStyle = "#ff5470aa"; ctx.fillRect(-3, -3, 6, 6);
      ctx.restore();
    } else {
      drawShip(en.x, en.y, Math.atan2(en.vy, en.vx), "#ff8c42", en.r);
    }
  });
  lasers.each(l => {
    ctx.shadowColor = l.color; ctx.shadowBlur = l.big ? 20 : 14;
    ctx.strokeStyle = l.color; ctx.lineWidth = l.big ? 5 : 3;
    ctx.beginPath(); ctx.moveTo(l.px, l.py); ctx.lineTo(l.x, l.y); ctx.stroke();
  });
  cores.each(c => {
    const pulse = 0.7 + Math.sin(c.age * 8) * 0.3;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.PI / 4);
    ctx.shadowColor = c.crystal ? "#ff6bd6" : "#ffd166"; ctx.shadowBlur = 12 * pulse;
    ctx.fillStyle = c.crystal ? "#ff6bd6" : "#ffd166";
    ctx.fillRect(-7 * pulse, -7 * pulse, 14 * pulse, 14 * pulse);
    ctx.restore();
  });
  if (!state.dead && (state.invuln <= 0 || Math.floor(state.t * 14) % 2 === 0)) {
    drawShip(state.px, state.py, state.aim, state.weapon === 0 ? "#7df9ff" : "#00c8ff", 20, true);
    ctx.shadowColor = state.weapon === 0 ? "#7df9ff" : "#00c8ff"; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(state.px, state.py, 30 + Math.sin(state.t * 6) * 3, 0, 7);
    ctx.strokeStyle = "rgba(125,249,255,.25)"; ctx.lineWidth = 1.5; ctx.stroke(); ctx.shadowBlur = 0;
  }
  popups.each(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color; ctx.font = "800 15px system-ui"; ctx.textAlign = "center";
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  });
  ctx.restore();
  renderParticles();
  if (touch.joyId !== null) {
    ctx.globalAlpha = 0.25; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(touch.joyOx, touch.joyOy, 52, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(touch.joyX, touch.joyY, 16, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
}
/* ============================ MAIN LOOP ============================= */
const STEP = 1/60; let acc = 0, last = performance.now(), paused = false;
document.addEventListener("visibilitychange", () => { paused = document.hidden || paused; last = performance.now(); acc = 0; });
$("startBtn").onclick = () => { audioInit(); beep(800, 0.05, "sine"); setScene("play"); };
$("retryBtn").onclick = () => { beep(800, 0.05, "sine"); setScene("play"); };
$("againBtn").onclick = () => { beep(800, 0.05, "sine"); setScene("play"); };
orientView();
function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min((now - last) / 1000, 0.25); last = now;
  pollInput();
  while (acc >= STEP) { if (!paused) scene.update(STEP); input.actionPressed = false; input.weaponPressed = false; acc -= STEP; }
  scene.render();
  if (paused && sceneName === "play") {
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0, 0, VIEW.w, VIEW.h);
    ctx.fillStyle = "#fff"; ctx.font = "700 26px system-ui"; ctx.textAlign = "center";
    ctx.fillText("PAUSADO — toca para reanudar", VIEW.w / 2, VIEW.h / 2);
  }
}
setScene("menu"); requestAnimationFrame(frame);
</script>
</body>
